<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preisrechner</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <section class="main container">
      <div class="main-card">
        <span class="title">Preisrechner</span>
        <div class="button-grid">
          <button>
            <span class="product-name">Künefe</span>
            <span class="product-price-container">
              <span class="product-price">5,50</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Baklava</span>
            <span class="product-price-container">
              <span class="product-price">4,00</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Cay</span>
            <span class="product-price-container">
              <span class="product-price">1,00</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Börek</span>
            <span class="product-price-container">
              <span class="product-price">4,00</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Pommes</span>
            <span class="product-price-container">
              <span class="product-price">3,50</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Köfte im Brot</span>
            <span class="product-price-container">
              <span class="product-price">7,50</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Köfte Teller</span>
            <span class="product-price-container">
              <span class="product-price">9,00</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Köfte Spezial</span>
            <span class="product-price-container">
              <span class="product-price">11,00</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Lahmacun</span>
            <span class="product-price-container">
              <span class="product-price">3,00</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Lahmacun Salat</span>
            <span class="product-price-container">
              <span class="product-price">5,00</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Lahmacun Döner</span>
            <span class="product-price-container">
              <span class="product-price">8,50</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Döner im Brot</span>
            <span class="product-price-container">
              <span class="product-price">7,50</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Döner Teller</span>
            <span class="product-price-container">
              <span class="product-price">9,50</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Ayran</span>
            <span class="product-price-container">
              <span class="product-price">1,50</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Adana Kebap</span>
            <span class="product-price-container">
              <span class="product-price">12,50</span>
              <span class="currency">€</span>
            </span>
          </button>
          <button>
            <span class="product-name">Lamm Kotlett</span>
            <span class="product-price-container">
              <span class="product-price">20,00</span>
              <span class="currency">€</span>
            </span>
          </button>
        </div>
        <hr class="divider" />
        <div class="total-row">
          <span class="total">Gesamt</span>
          <span class="total-amount-container">
            <span class="total-amount">0,00</span>
            <span>€</span>
          </span>
        </div>
        <div class="button-container">
          <button class="reset-btn">Zurücksetzen</button>
          <button class="locally-btn">Vor Ort</button>
          <button class="delivery-btn">Lieferung</button>
        </div>
      </div>
      <div class="side-card">
        <span class="title">Bestellung</span>
      </div>
    </section>
  </body>
</html>
